# -------------------------------------------------------------------
#  ⚙️  Build‑system
# -------------------------------------------------------------------
[build-system]
requires = [
  "setuptools>=61.0",
  "wheel",
  "torch",          # resolved from the CUDA 12.8 index below
  "transformers",
  "pybind11",
  "cmake",
  "ninja"
]
build-backend = "setuptools.build_meta"


# -------------------------------------------------------------------
#  📦  Project metadata (PEP 621 / 735)
# -------------------------------------------------------------------
[project]
name            = "verl"
description     = "verl: Volcano Engine Reinforcement Learning for LLM"
license         = { text = "Apache-2.0" }
readme          = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"

# The version string lives in a file so CI can bump it without editing
# the TOML.
dynamic = ["version"]

# First‑party *runtime* deps. Listing the workspace packages here makes
# them install automatically on every plain `uv sync`.
dependencies = [
  "megatron-core",
  "mbridge",
  "pandas>=2.3.1",
  "regex",
  "pyyaml",
  "transformers"
]

[project.optional-dependencies]
# Expose the same two packages as an *extra* so that
#   pip install .[megatron]
# works outside of uv.
megatron = ["megatron-core", "mbridge"]
dev = ["pytest", "accelerate"]

# -------------------------------------------------------------------
#  setuptools extras
# -------------------------------------------------------------------
[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.package-data]
verl = [
  "version/*",
  "trainer/config/*.yaml",
  "trainer/config/*/*.yaml",
]

# Read the version string from a plain‐text file.
[tool.setuptools.dynamic]
version = { file = "verl/version/version" }


# -------------------------------------------------------------------
#  🧩  Dependency groups (PEP 735)
# -------------------------------------------------------------------
# `uv` calls these *development* groups.  We mirror the extra above
# so that other tools remain consistent.
[dependency-groups]
megatron = ["megatron-core", "mbridge"]


# -------------------------------------------------------------------
#  🗂️  Workspace layout
# -------------------------------------------------------------------
[tool.uv.workspace]
members = [
  "thirdparty/megatron-lm",  # contains megatron‑core
  "thirdparty/mbridge",      # contains mbridge
]

# Map the public names to their workspace sources.
[tool.uv.sources]
megatron-core = { workspace = true }
mbridge       = { workspace = true }

# Force the Torch family to come from the CUDA 12.8 index.
torch       = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
triton      = [{ index = "pytorch-cu128" }]


# -------------------------------------------------------------------
#  🌐  Package indexes
# -------------------------------------------------------------------
[[tool.uv.index]]
name     = "pytorch-cu128"
url      = "https://download.pytorch.org/whl/cu128"
explicit = true   # only resolve packages that are *explicitly* pointed here


# -------------------------------------------------------------------
#  🔧  Misc uv settings
# -------------------------------------------------------------------
[tool.uv]
# Build some heavy wheels in‑tree instead of in isolated tmp dirs
no-build-isolation-package = [
  "transformer-engine-torch",
  "transformer-engine",
  "flash-attn",
]

# Install the “megatron” group every time without needing `-g`
default-groups = ["megatron"]
